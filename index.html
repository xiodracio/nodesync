<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; media-src 'self'; connect-src https://agzhxwditnlzdcuqjjfz.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Channel Access · Illuminati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--surface:#151518;--surface2:#1b1b1f;--line:#34353a;--text:#f0f1f4;--mute:#a9adb5;--dim:#7d8088;--accent:#dfe3ea;--bad:#ff9a9a;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;background-image:radial-gradient(ellipse 60% 40% at 50% 0,rgba(150,160,178,.12),transparent 70%);background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{width:min(520px,100% - 32px);margin:0 auto;padding:28px 0 56px}
h1{font-family:var(--serif);font-weight:500;line-height:1.1;letter-spacing:.02em}
h1{font-size:clamp(34px,9vw,46px);margin-top:10px}
.eye{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);font-weight:500}
.sub{color:var(--mute);font-size:14px;margin:8px 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 24px;border:1px solid var(--line);border-radius:999px;font:600 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;background:transparent;color:var(--text);cursor:pointer;transition:.25s}
.btn:hover{border-color:var(--accent);background:rgba(255,255,255,.04)}
.btn.solid{background:var(--accent);color:#0a0a0b;border-color:var(--accent)}
.btn.solid:hover{background:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn.loading{position:relative;overflow:hidden;pointer-events:none}
.btn.solid.loading:disabled{opacity:1}
.btn.loading::before{content:"";flex:none;width:14px;height:14px;border:2px solid rgba(10,10,11,.22);border-top-color:#0a0a0b;border-radius:50%;animation:spin .7s linear infinite}
.btn.loading::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheen{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.btn.loading::after{animation:none}}
.err{min-height:1.5em;margin:2px 0 8px;color:var(--bad);font-size:13px}
.mut{color:var(--mute)}
.link{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.done{text-align:center;padding:50px 20px}
.done .big{font-family:var(--serif);font-size:clamp(40px,11vw,64px);line-height:1.05;margin:14px 0;background:linear-gradient(180deg,#fff 10%,#9ea3ad 70%,#5f636b);-webkit-background-clip:text;background-clip:text;color:transparent}
#intro{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .8s ease}
#intro.out{opacity:0;pointer-events:none}
#intro video{width:100%;height:100%;object-fit:contain;background:#000}
@media (max-aspect-ratio:3/4){#intro video{object-fit:cover}}
#intro .ctl{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding:0 20px}
#intro .ctl .link{color:#a9adb5;background:rgba(0,0,0,.45);padding:10px 14px;border-radius:999px;text-decoration:none}
body.introing{overflow:hidden;height:100vh}

.c{text-align:center}
</style>
</head>
<body>
<main>

<!-- INTRO VIDEO -->
<div id="intro" hidden>
  <video id="iv" src="intro.mp4" muted playsinline preload="auto" disablepictureinpicture></video>
  <div class="ctl"><button class="link" id="snd" type="button">Sound on</button><button class="link" id="skip" type="button">Skip</button></div>
</div>

<!-- PAYMENT GATE -->
<section id="gate" hidden>
  <span class="eye">Entry protocol</span>
  <h1>Channel<br>Access</h1>
  <p class="sub" id="gsub">Unlock access to the private channel. One-time entry: 250 &#9733; Telegram Stars, includes your first month.</p>
  <div class="card c"><button class="btn solid" id="pay" type="button" style="width:100%">Unlock access</button><p class="err" id="pe" role="alert" style="margin:10px 0 0"></p></div>
</section>

<!-- DONE -->
<section id="done" class="card done" hidden>
  <span class="eye">Protocol</span>
  <div class="big">Channel<br>Access</div>
  <p class="mut" id="dn">Adding you to the channel&hellip;</p>
  <button class="btn solid" id="inv" type="button" hidden style="margin-top:22px;margin-right:8px">Request channel access</button>
</section>

</main>
<script>
// ===== CONFIG: same Supabase project as the main site =====
const CFG={
  PROJECT:"https://agzhxwditnlzdcuqjjfz.supabase.co",
  KEY:"sb_publishable_-B_v-SqjFjh_Q8R29CksBQ_nO4KgmYy",
  PAY:"https://agzhxwditnlzdcuqjjfz.supabase.co/functions/v1/stars-gate"
};
const $=i=>document.getElementById(i);
const H={apikey:CFG.KEY,Authorization:"Bearer "+CFG.KEY,"Content-Type":"application/json"};
const show=id=>["gate","done"].forEach(s=>$(s).hidden=s!==id);

/* ---------- Telegram Stars: 250 one-time entry (includes month 1), then 20/month subscription ---------- */
const TG=window.Telegram&&Telegram.WebApp,INIT=(TG&&TG.initData)||"";
try{if(TG){TG.ready();TG.expand()}}catch(e){}
let MODE="entry",rerouted=false,PRE=null;
/* warm up: create the invoice link in the background while the user reads the page */
function prefetch(){if(!INIT)return;PRE=api("invoice",{kind:MODE}).then(r=>(r&&r.link)||null).catch(()=>null)}
async function api(action,extra){
  const r=await fetch(CFG.PAY,{method:"POST",headers:H,body:JSON.stringify({action,initData:INIT,...extra})});
  let j={};try{j=await r.json()}catch(_){}
  if(!r.ok){const er=new Error((j&&j.error)||("HTTP "+r.status));er.status=r.status;er.code=j&&j.error;throw er}
  return j}
function gateMode(m){MODE=m;
  $("gsub").textContent=m==="entry"?"Unlock access to the private channel. One-time entry: 250 \u2605 Telegram Stars, includes your first month.":"Your first month is covered by the entry fee. To keep your place in the channel from here on: 20 \u2605 every 30 days. Cancel anytime in Telegram.";
  $("pay").textContent=m==="entry"?"Unlock access":"Activate monthly access";show("gate");prefetch()}
/* where to resume: never paid -> pay entry (covers month 1); paid month ending/over -> 20 \u2605 monthly; otherwise straight into the channel */
function route(st){
  if(!(st.paid||st.synced))return gateMode("entry");   // members already on record are never asked for the entry fee again
  if(!st.sub||st.renew)return gateMode("sub");         // monthly 20 \u2605 only when the first paid month is ending or over
  grant()}
/* paid and in good standing: add them to the channel right away */
async function grant(){
  show("done");$("inv").hidden=true;$("dn").textContent="Adding you to the channel\u2026";
  let j={};
  try{j=await api("access")}catch(e){}
  if(!(j&&(j.approved||j.invite))){try{j=await api("claim")}catch(e){}}
  finish(j||{})}
function finish(j){
  if(j.approved){$("dn").textContent="Access granted. You have been approved into the channel. You can close this window and open the channel in Telegram."}
  else if(j.invite){$("dn").textContent="Payment confirmed. Tap \u201cRequest to join\u201d in Telegram and you will be approved instantly.";
    const open=()=>{try{TG.openTelegramLink(j.invite)}catch(e){location.href=j.invite}};
    const a=$("inv");a.textContent="Request to join channel";a.hidden=false;a.onclick=()=>{open();pollAccess()};
    setTimeout(()=>{open();pollAccess()},600)}   // opens the join prompt by itself; the bot approves the request the moment it arrives
  else if(j.error==="subscription"&&!rerouted){rerouted=true;api("status").then(route).catch(()=>{})}
  else{$("dn").textContent="Could not confirm access. Tap below to try again.";
    const a=$("inv");a.textContent="Try again";a.hidden=false;a.onclick=grant}}
/* after the join prompt opens, keep checking until the bot has approved the request, then continue automatically */
let polling=false;
function pollAccess(){if(polling)return;polling=true;let n=0;
  const t=setInterval(async()=>{n++;try{const r=await api("access");if(r&&r.approved){clearInterval(t);finish(r)}}catch(e){}if(n>60){clearInterval(t);polling=false}},2500)}
async function waitFor(k,n=12){for(let i=0;i<n;i++){try{const s=await api("status");if(k==="paid"?s.paid:(s.sub&&!s.renew))return s}catch(e){}await new Promise(r=>setTimeout(r,1000))}return null}
$("pay").onclick=async()=>{
  const b=$("pay"),e=$("pe"),label=b.textContent;e.textContent="";
  if(!INIT){e.textContent="Open this from the Telegram bot to continue.";return}
  b.disabled=true;b.classList.add("loading");b.textContent="Synchronizing\u2026";
  const reset=()=>{b.disabled=false;b.classList.remove("loading");b.textContent=label};
  /* wait for the bot webhook to record the payment, then continue */
  const confirm=async()=>{b.textContent="Confirming\u2026";const s=await waitFor(MODE==="entry"?"paid":"sub");
    if(s){reset();return route(s)}
    e.textContent="Payment received, still confirming. Reopen in a moment.";reset()};

  /* 1) ask the server for an invoice link */
  let link;
  try{
    link=PRE?await PRE:null;PRE=null;                       // already created in the background? use it instantly
    if(!link){const r=await api("invoice",{kind:MODE});link=r&&r.link}
    if(!link)throw new Error("no invoice link returned");
  }catch(x){
    // already paid / existing member / not due yet: the server says so with 409, so just re-route from the real status
    if(x.status===409||x.status===402){try{return route(await api("status"))}catch(_){}}
    e.textContent=x.status===401?"Session expired. Close this window and reopen it from the bot."
      :"Could not create the invoice ("+(x.code||x.message)+"). Please try again.";
    return reset()}

  /* 2) open the Telegram Stars payment sheet */
  try{
    if(TG.isVersionAtLeast&&!TG.isVersionAtLeast("6.1"))throw new Error("Telegram is out of date");
    TG.openInvoice(link,async st=>{
      if(st==="paid")return confirm();
      if(st==="failed")e.textContent="Payment failed. Try again.";
      reset()});
  }catch(x){
    // fallback: open the invoice link as a normal Telegram link and watch for the payment to land
    try{
      TG.openTelegramLink(link);
      e.textContent="Complete the payment in Telegram, then come back here.";
      const s=await waitFor(MODE==="entry"?"paid":"sub",90);
      if(s){e.textContent="";reset();return route(s)}
      reset();
    }catch(y){
      e.textContent="Could not open the payment window ("+((x&&x.message)||x)+"). Update Telegram and try again.";
      reset()}}};

/* boot: resume wherever this Telegram user left off, so nothing is ever paid twice */
show("gate");
if(!INIT)$("pe").textContent="Open this from the Telegram bot to continue.";
else api("status").then(route).catch(()=>{});

/* ---------- intro video: plays once per session, skippable, never blocks the app ---------- */
(function(){
  const box=$("intro"),v=$("iv");let done=false;
  try{if(sessionStorage.getItem("ns-intro")){return}}catch(e){}
  function end(){if(done)return;done=true;try{sessionStorage.setItem("ns-intro","1")}catch(e){}
    box.classList.add("out");document.body.classList.remove("introing");try{v.pause()}catch(e){}
    setTimeout(()=>{box.hidden=true},900)}
  box.hidden=false;document.body.classList.add("introing");
  v.addEventListener("ended",end);v.addEventListener("error",end);
  $("skip").onclick=end;
  $("snd").onclick=()=>{v.muted=!v.muted;$("snd").textContent=v.muted?"Sound on":"Sound off";if(v.paused)v.play().catch(()=>{})};
  const p=v.play();if(p&&p.catch)p.catch(end);
  setTimeout(()=>{if(!done&&v.currentTime===0)end()},4000);   // never stuck on a black screen
})();
</script>
</body>
</html>
